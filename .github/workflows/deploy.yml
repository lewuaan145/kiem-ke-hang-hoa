name: Deploy PWA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract PWA
        run: |
          mkdir -p app
          unzip -o "kiem-ke-hang-hoa-PWA-offline-scan-v2.zip" -d app

      - name: Find project
        run: |
          PACKAGE=$(find app -name package.json -type f | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "Khong tim thay package.json"
            find app -maxdepth 4 -type f
            exit 1
          fi

          APP_DIR=$(dirname "$PACKAGE")

          echo "Project: $APP_DIR"

          cd "$APP_DIR"

          npm install
          npm run build

          rm -rf "$GITHUB_WORKSPACE/dist"
          cp -r dist "$GITHUB_WORKSPACE/dist"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
